[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cytovanni"
authors = [
    { name = "Valentin Wüst", email = "valentin.wuest@bioquant.uni-heidelberg.de" },
    { name = "Simon Anders", email = "simon.anders@bioquant.uni-heidelberg.de" },
]
maintainers = [
    { name = "Valentin Wüst", email = "valentin.wuest@bioquant.uni-heidelberg.de" },
]
dynamic = ["version"]
description = "Computational Standardization of Flow Cytometry Data"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "pandas<3",  # pandas 3 (copy-on-write) not yet tested, see FIXLOG R2-C15
    "torch",
    "anndata",
    "flowkit",
    "flowio",
    "flowutils",
    "matplotlib",
    "seaborn",
    "scipy",
    "scikit-learn",
    "joblib",
    "tzdata",  # zoneinfo data for CytometerConfiguration.timezone, see FIXLOG R2-F1
    "statsmodels",
    "tqdm",
    "Pillow",
    "python-dateutil",
]

[project.optional-dependencies]
geom = ["geomloss", "pykeops"]
plot = ["datashader", "colorcet"]
all = ["cytovanni[geom,plot]"]
test = ["pytest", "pytest-cov", "pytest-xdist"]

[project.urls]
Repository = "https://github.com/anders-biostat/Cytovanni"

[tool.hatch.version]
path = "src/cytovanni/version.py"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]        # test the checkout, also when another cytovanni version is installed
addopts = "-ra --strict-markers -m 'not data and not keops'"
markers = [
    "slow: larger fits (deselect with -m 'not slow')",
    "gpu: needs CUDA (skipped without a GPU)",
    "keops: needs a working pykeops (KeOps compilation)",
    "data: needs the example data (env CYTOVANNI_TEST_DATA); run with -m data",
    "snapshot: compares with stored results of an earlier version (tests/snapshots)",
]
filterwarnings = [
    "ignore::DeprecationWarning:flowkit.*",
    "ignore::FutureWarning:anndata.*",
]

[tool.coverage.run]
source = ["cytovanni"]
branch = true

[tool.coverage.report]
fail_under = 70
show_missing = false
skip_empty = true
